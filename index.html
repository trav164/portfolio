<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lewis Travis — fullstack web developer based in Sheffield, UK." />
    <meta name="theme-color" content="#dfdcd8" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#151213" : "#dfdcd8";
      })();
    </script>
    <link rel="icon" href="/favicon.png" />
    <title>Lewis Travis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
